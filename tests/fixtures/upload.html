<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>upload</title>
  </head>
  <body>
    <label for="flyer">Attach flyer</label>
    <input id="flyer" type="file" />
    <p id="upload-result">no file</p>
    <script>
      document.getElementById("flyer").addEventListener("change", (e) => {
        const file = e.target.files[0];
        document.getElementById("upload-result").textContent = file
          ? file.name
          : "no file";
      });
    </script>
  </body>
</html>
