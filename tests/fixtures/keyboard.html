<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>keyboard</title>
    <style>
      #combo {
        border: 1px solid #888;
        width: 160px;
        min-height: 24px;
        padding: 4px 8px;
      }
      [role="listbox"] {
        border: 1px solid #ccc;
        width: 160px;
      }
      [role="option"] {
        padding: 4px 8px;
      }
      [role="option"][aria-selected="true"] {
        background: #def;
      }
    </style>
  </head>
  <body>
    <!-- title-only control: the accessible-name fallback chain must reach
         past aria-label/aria-labelledby/label to the title attribute. -->
    <button id="info" title="More information">
      <span aria-hidden="true">ⓘ</span>
    </button>

    <div
      id="combo"
      role="combobox"
      aria-label="Choose a plan"
      aria-expanded="false"
      tabindex="0"
    ></div>
    <ul id="listbox" role="listbox" hidden>
      <li role="option" id="opt-a" tabindex="-1">Option A</li>
      <li role="option" id="opt-b" tabindex="-1">Option B</li>
      <li role="option" id="opt-c" tabindex="-1">Option C</li>
    </ul>
    <p id="plan-result">none</p>
    <script>
      const combo = document.getElementById("combo");
      const listbox = document.getElementById("listbox");
      const options = [...listbox.querySelectorAll('[role="option"]')];
      let activeIndex = -1;

      function open() {
        listbox.hidden = false;
        combo.setAttribute("aria-expanded", "true");
      }
      function highlight(i) {
        activeIndex = i;
        options.forEach((o, idx) =>
          o.setAttribute("aria-selected", String(idx === i))
        );
      }
      function commit() {
        if (activeIndex >= 0) {
          document.getElementById("plan-result").textContent =
            options[activeIndex].textContent;
        }
        listbox.hidden = true;
        combo.setAttribute("aria-expanded", "false");
      }

      options.forEach((option, index) => {
        option.addEventListener("click", () => {
          highlight(index);
          commit();
        });
      });

      combo.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (listbox.hidden) {
            open();
            highlight(0);
          } else {
            highlight(Math.min(activeIndex + 1, options.length - 1));
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!listbox.hidden) {
            highlight(Math.max(activeIndex - 1, 0));
          }
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (!listbox.hidden) commit();
        } else if (e.key === "Escape") {
          listbox.hidden = true;
          combo.setAttribute("aria-expanded", "false");
        }
      });
    </script>
  </body>
</html>
